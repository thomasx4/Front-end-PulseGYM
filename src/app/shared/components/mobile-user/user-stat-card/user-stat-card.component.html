<div class="user-stat-card">
    <div class="stat-header">
        <span class="stat-title">{{ title }}</span>

        <svg *ngIf="icon === 'fire'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a2a4a"
            stroke-width="2">
            <path
                d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z">
            </path>
        </svg>

        <svg *ngIf="icon === 'utensils'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a2a4a"
            stroke-width="2">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
            <path d="M7 2v20"></path>
            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
        </svg>

        <svg *ngIf="icon === 'calendar'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a2a4a"
            stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
    </div>

    <div class="stat-value-row">
        <span class="stat-value">{{ value }}</span>
        <span class="stat-subtitle" *ngIf="subtitle">{{ subtitle }}</span>
    </div>

    <div class="stat-progress-bar" *ngIf="progress && !progressSegments.length">
        <div class="progress-fill" [style.width.%]="progress"></div>
    </div>

    <div class="stat-segments" *ngIf="progressSegments.length">
        <div *ngFor="let seg of progressSegments" class="segment" [class.filled]="seg === 1"></div>
    </div>

    <span class="stat-extra" *ngIf="extra">{{ extra }}</span>
</div>
