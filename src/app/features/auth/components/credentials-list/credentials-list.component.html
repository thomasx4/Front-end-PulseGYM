<table class="users-table" *ngIf="!cargando && !errorMensaje">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Rol</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let usuario of credenciales">
      <td>
        <div class="users-table__nombre">{{ usuario.username }}</div>
        <div class="users-table__email">{{ usuario.email }}</div>
      </td>
      <td>{{ usuario.rol }}</td>
      <td>
        <span [class]="usuario.estado ? 'badge badge--success' : 'badge badge--neutral'">
          {{ usuario.estado ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
      <td>
        <button class="btn-accion" (click)="CredencialesEstado(usuario)">
          {{ usuario.estado ? 'Desactivar' : 'Activar' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div class="modal-overlay" *ngIf="mostrarFormulario" (click)="cerrarFormulario()">
  <div class="modal-contenido" (click)="$event.stopPropagation()">
    <button class="modal-cerrar" (click)="cerrarFormulario()">✕</button>
    <app-register-credentials></app-register-credentials>
  </div>
</div>
