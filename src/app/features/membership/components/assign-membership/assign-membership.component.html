<div class="membership-page">

    <!-- ENCABEZADO -->
    <div class="membership-header">
        <h1>Asignar Membresía</h1>
        <p class="membership-subtitle">Selecciona una membresia activa para asignarla a un socio.</p>
    </div>

    <!-- GRID DE MEMBRESÍAS -->
    <div class="membership-grid">
        <div *ngFor="let membresia of membresias" class="membership-card"
            [class.membership-card--destacado]="membresia.destacado">
            <!-- ÍCONO DE FONDO (MARCA DE AGUA) -->
            <div class="membership-card__watermark" *ngIf="membresia.iconoFondo">
                <!-- Mancuerna -->
                <svg *ngIf="membresia.iconoFondo === 'dumbbell'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8">
                    <path d="M6.5 6.5h11M6.5 17.5h11M6 20v-5M18 20v-5M6 9V4M18 9V4M4 15h4M16 15h4M4 9h4M16 9h4"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <!-- Estrella -->
                <svg *ngIf="membresia.iconoFondo === 'star'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
            </div>

            <!-- BADGE DESTACADO (MÁS POPULAR) -->
            <div class="membership-card__badge" *ngIf="membresia.badgeText">
                {{ membresia.badgeText }}
            </div>

            <!-- CUERPO DE LA TARJETA -->
            <div class="membership-card__body">
                <h2 class="membership-card__title">{{ membresia.nombre }}</h2>

                <div class="membership-card__price">
                    <span class="price-value">${{ membresia.precio }}</span>
                    <span class="price-period">/{{ membresia.periodo }}</span>
                </div>

                <!-- LISTA DE BENEFICIOS -->
                <ul class="membership-card__benefits">
                    <li *ngFor="let beneficio of membresia.beneficios">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span>{{ beneficio }}</span>
                    </li>
                </ul>

                <!-- ESTADO -->
                <div class="membership-card__status">
                    <span class="status-dot"></span>
                    <span class="status-text">{{ membresia.estado }}</span>
                </div>
            </div>

            <!-- PIE DE LA TARJETA -->
            <div class="membership-card__footer">
                <button class="btn btn--primary" (click)="asignarMembresia(membresia.id)">
                    Asignar a socio
                </button>
                <button class="btn btn--outline" (click)="verSocios(membresia.id)">
                    Ver socios ({{ membresia.sociosActivos }})
                </button>
            </div>

        </div>
    </div>

</div>
