<div class="filter-menu">
    <button type="button" class="filter-btn" (click)="toggle()">
        <span class="filter-btn__icon">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <path d="M0 3H16V1H0V3Z" fill="#000000"></path>
                    <path d="M2 7H14V5H2V7Z" fill="#000000"></path>
                    <path d="M4 11H12V9H4V11Z" fill="#000000"></path>
                    <path d="M10 15H6V13H10V15Z" fill="#000000"></path>
                </g>
            </svg>
        </span>
        <span class="filter-btn__label">Filtrar</span>
    </button>

    <div class="filter-menu__panel" *ngIf="abierto">
        <label>
            Rol
            <select [(ngModel)]="rolSeleccionado">
                <option value="">Todos</option>
                <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
            </select>
        </label>
        <label>
            Estado
            <select [(ngModel)]="estadoSeleccionado">
                <option value="">Todos</option>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
        </label>
        <label>
            Ordenar
            <select [(ngModel)]="direccionSeleccionado">
                <option value="desc">Más reciente primero</option>
                <option value="asc">Más antiguo primero</option>
            </select>
        </label>
        <div class="filter-menu__acciones">
            <button class="filter-menu__accion" type="button" (click)="onLimpiar()">Limpiar</button>
            <button class="filter-menu__accion" type="button" (click)="onAplicar()">Aplicar</button>
        </div>
    </div>
</div>
