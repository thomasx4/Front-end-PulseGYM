<div class="login-container">
    <!-- Panel Izquierdo -->
    <div class="login-left">
        <div class="overlay"></div>
        <div class="brand-content">
            <h1 class="brand-title">{{ slides[currentSlide].title }}</h1>
            <p class="brand-subtitle">{{ slides[currentSlide].subtitle }}</p>
            <div class="slider-dots">
                <span *ngFor="let slide of slides; let i = index" class="dot" [class.active]="i === currentSlide"
                    (click)="goToSlide(i)">
                </span>
            </div>
        </div>
    </div>

    <!-- Panel Derecho -->
    <div class="login-right">
        <div class="login-form-wrapper">
            <div class="form-header">
                <h2>Inicia Sesion</h2>
                <p class="form-subtitle">Inicia sesion para acceder a todas las funcionalidades.</p>
            </div>

            <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                <!-- Email -->
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input id="email" type="email" formControlName="email" placeholder="nombre@ejemplo.com"
                            [class.error]="loginForm?.get('email')?.invalid && loginForm?.get('email')?.touched">
                    </div>
                    <span class="error-message"
                        *ngIf="loginForm?.get('email')?.invalid && loginForm?.get('email')?.touched">
                        Ingresa un correo válido
                    </span>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">CONTRASEÑA</label>
                        <a (click)="goToForgotPassword()" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                            placeholder="••••••••"
                            [class.error]="loginForm?.get('password')?.invalid && loginForm?.get('password')?.touched">
                        <button type="button" class="toggle-password" (click)="togglePassword()">
                            <svg *ngIf="hidePassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg *ngIf="!hidePassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68">
                                </path>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7c.78 0 1.53-.09 2.24-.26"></path>
                                <path d="M2 2l20 20"></path>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message"
                        *ngIf="loginForm?.get('password')?.invalid && loginForm?.get('password')?.touched">
                        La contraseña es obligatoria
                    </span>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn-login" [disabled]="loading || isLoginLocked()">
                    <ng-container *ngIf="!loading && !isLoginLocked()">
                        Entrar
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="margin-left: 6px;">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </ng-container>
                    <ng-container *ngIf="loading">
                        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                        Entrando...
                    </ng-container>
                    <ng-container *ngIf="!loading && isLoginLocked()">
                        <span style="opacity: 0.6;">Bloqueado</span>
                    </ng-container>
                </button>
            </form>
        </div>

        <!-- Icono de ayuda -->
        <button type="button" class="help-button" title="Ayuda">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <path d="M12 17h.01"></path>
            </svg>
        </button>
    </div>
</div>
