<header class="header">
    <div class="header__left">
        <button class="menu-toggle-btn" (click)="onToggleMenu()" aria-label="Abrir menú">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <span class="header__brand-title">PULSE GYM</span>
    </div>

    <div class="header__actions">
        <div class="divider"></div>

        <div class="user-profile">
            <div class="user-profile__info">
                <span class="user-profile__name">{{ userName }}</span>
                <span class="user-profile__role">{{ userRole }}</span>
            </div>

            <div class="user-profile__avatar-badge">
                <div class="user-profile__avatar">
                    <img *ngIf="avatarUrl && !hasAvatarError" [src]="avatarUrl" [alt]="userName" crossOrigin="anonymous"
                        (error)="onAvatarError()" />

                    <span *ngIf="!avatarUrl || hasAvatarError" class="avatar-initials">
                        {{ getInitials(userName) }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</header>
