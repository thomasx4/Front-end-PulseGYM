server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para rutas de Angular (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el API Gateway (puerto 9090)
    location /pg-ms-auth/ {
        proxy_pass http://pg-ms-gateway:9090/pg-ms-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pg-ms-users/ {
        proxy_pass http://pg-ms-gateway:9090/pg-ms-users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pg-ms-operation/ {
        proxy_pass http://pg-ms-gateway:9090/pg-ms-operation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pg-ms-ai/ {
        proxy_pass http://pg-ms-gateway:9090/pg-ms-ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pg-ms-reports/ {
        proxy_pass http://pg-ms-gateway:9090/pg-ms-reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}