<div class="p-6 max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Configuración Global de Límites (Rate Limiting)</h2>

    <div *ngIf="mensajeExito" class="mb-4 p-4 bg-green-100 text-green-700 rounded-lg">
        {{ mensajeExito }}
    </div>

    <div class="bg-white shadow-md rounded-lg p-6 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700">Máximo de notificaciones por minuto por
                usuario</label>
            <input [(ngModel)]="config.maxNotificacionesPorMinuto" type="number" min="1"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            <p class="text-xs text-gray-500 mt-1">Límite estricto para evitar spam por minuto.</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Máximo de notificaciones por día por usuario</label>
            <input [(ngModel)]="config.maxNotificacionesPorDia" type="number" min="1"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            <p class="text-xs text-gray-500 mt-1">Tope máximo acumulado en un periodo de 24 horas.</p>
        </div>

        <div class="flex justify-end">
            <button (click)="guardarConfiguracion()"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Guardar Cambios
            </button>
        </div>
    </div>
</div>
