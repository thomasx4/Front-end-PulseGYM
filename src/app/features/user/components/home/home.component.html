<div class="dashboard-layout">
    <app-user-sidebar></app-user-sidebar>

    <main class="dashboard-main">
        <header class="top-bar">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Search...">
            </div>
            <div class="top-actions">
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </button>
                <div class="avatar"></div>
            </div>
        </header>

        <section class="welcome-section">
            <h1>{{ greeting }}, {{ username }}.</h1>
            <p>Here is your progress for today.</p>
        </section>

        <div class="dashboard-grid">
            <div class="grid-main">
                <div class="stats-row">
                    <app-user-stat-card *ngFor="let stat of stats" [title]="stat.title" [value]="stat.value"
                        [subtitle]="stat.subtitle" [extra]="stat.extra" [icon]="stat.icon" [progress]="stat.progress"
                        [progressSegments]="stat.progressSegments">
                    </app-user-stat-card>
                </div>

                <app-user-weekly-activity [title]="'Weekly Activity'" [data]="weeklyActivity">
                </app-user-weekly-activity>
            </div>

            <div class="grid-side">
                <app-user-quick-actions [title]="'Quick Actions'" [actions]="quickActions">
                </app-user-quick-actions>

                <app-user-promo-card *ngIf="promo" [title]="promo.title" [description]="promo.description"
                    [actionLabel]="promo.actionLabel" [imageUrl]="promo.imageUrl">
                </app-user-promo-card>
            </div>
        </div>
    </main>
</div>
