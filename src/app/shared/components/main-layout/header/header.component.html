<header class="header">
    <div class="header__actions">
        <!-- NOTIFICACIONES -->
        <div class="notification-container">
            <button type="button" class="icon-btn" aria-label="Notificaciones">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="notification-dot"></span>
            </button>
        </div>

        <!-- SEPARADOR -->
        <div class="divider"></div>

        <!-- PERFIL DE USUARIO -->
        <div class="user-profile">
            <div class="user-profile__info">
                <span class="user-profile__name">{{ userName }}</span>
                <span class="user-profile__role">{{ userRole }}</span>
            </div>

            <div class="user-profile__avatar-badge">
                <div class="user-profile__avatar">
                    <img *ngIf="avatarUrl && !hasAvatarError" [src]="avatarUrl" [alt]="userName" crossOrigin="anonymous"
                        (error)="onAvatarError()" />

                    <span *ngIf="!avatarUrl || hasAvatarError" class="avatar-initials">
                        {{ getInitials(userName) }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</header>
