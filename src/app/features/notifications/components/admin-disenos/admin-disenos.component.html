<div class="p-6 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Diseños HTML de Correos Electrónicos</h2>
        <button (click)="abrirModalCrear()"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            + Nuevo Diseño
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let d of disenos" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
            <div class="p-4 text-white"
                [style.background]="'linear-gradient(135deg, ' + d.colorPrincipal + ' 0%, ' + d.colorSecundario + ' 100%)'">
                <h3 class="font-bold text-lg">{{ d.tituloHeader }}</h3>
                <p class="text-xs opacity-90">{{ d.subtituloHeader }}</p>
            </div>
            <div class="p-4 space-y-2">
                <p class="text-sm font-semibold text-gray-700">Nombre: <span class="font-normal text-gray-600">{{
                        d.nombre }}</span></p>
                <p class="text-sm font-semibold text-gray-700">Evento: <span class="font-normal text-gray-600">{{
                        d.eventoAsociado }}</span></p>
                <div class="flex justify-end pt-2">
                    <button (click)="abrirModalEditar(d)"
                        class="text-indigo-600 hover:text-indigo-900 text-sm font-semibold">Editar Estilos</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div *ngIf="modalAbierto" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl">
            <h3 class="text-xl font-bold mb-4">{{ esEdicion ? 'Editar Diseño' : 'Nuevo Diseño' }}</h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Identificador (Nombre)</label>
                    <input [(ngModel)]="disenoForm.nombre" type="text"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Color Principal</label>
                        <input [(ngModel)]="disenoForm.colorPrincipal" type="color"
                            class="mt-1 block w-full h-10 rounded border p-1 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Color Secundario</label>
                        <input [(ngModel)]="disenoForm.colorSecundario" type="color"
                            class="mt-1 block w-full h-10 rounded border p-1 cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Título Header</label>
                    <input [(ngModel)]="disenoForm.tituloHeader" type="text"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Subtítulo Header</label>
                    <input [(ngModel)]="disenoForm.subtituloHeader" type="text"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-3">
                <button (click)="cerrarModal()"
                    class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Cancelar</button>
                <button (click)="guardarDiseno()"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Guardar</button>
            </div>
        </div>
    </div>
</div>
