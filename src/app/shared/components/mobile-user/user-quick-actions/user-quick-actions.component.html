<div class="user-quick-actions">
    <h3 class="actions-title">{{ title }}</h3>
    <div class="actions-list">
        <button *ngFor="let action of actions" class="action-btn" [class.primary]="action.variant === 'primary'"
            [class.secondary]="action.variant === 'secondary'" [routerLink]="action.route">
            <svg *ngIf="action.icon === 'plus'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>

            <svg *ngIf="action.icon === 'calendar'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>

            {{ action.label }}
        </button>
    </div>
</div>
