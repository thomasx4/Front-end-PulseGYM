<header class="header">
    <!-- BARRA DE BÚSQUEDA -->
    <div class="search-bar">
        <svg class="search-bar__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <input type="text" class="search-bar__input"  placeholder="Search members, metrics or equipment..."
            (input)="onSearch($event)" />
    </div>

    <!-- ACCIONES DEL HEADER -->
    <div class="header__actions">
        <!-- NOTIFICACIONES -->
        <div class="notification-container">
            <button type="button" class="icon-btn" aria-label="Notificaciones">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="notification-dot"></span>
            </button>
        </div>

        <!-- SEPARADOR -->
        <div class="divider"></div>

        <!-- PERFIL DE USUARIO -->
        <div class="user-profile">
            <div class="user-profile__info">
                <span class="user-profile__name">{{ userName }}</span>
                <span class="user-profile__role">{{ userRole }}</span>
            </div>
            <div class="user-profile__avatar">
                <img [src]="avatarUrl" [alt]="userName" />
            </div>
        </div>
    </div>
</header>
