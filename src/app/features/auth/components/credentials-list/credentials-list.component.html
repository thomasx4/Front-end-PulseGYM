<nav class="nav">
  <h1 class="nav__title">Administrar Credenciales</h1>
  <div class="nav__buttons">
    <app-filter-credentials (aplicar)="onFiltrosAplicados($event)"></app-filter-credentials>
    <button type="button" class="nav__add-user" (click)="abrirFormulario()">
      <span class="nav__add-user-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M20 18L14 18M17 15V21M4 21C4 17.134 7.13401 14 11 14C11.695 14 12.3663 14.1013 13 14.2899M15 7C15 9.20914 13.2091 11 11 11C8.79086 11 7 9.20914 7 7C7 4.79086 8.79086 3 11 3C13.2091 3 15 4.79086 15 7Z"
              stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </g>
        </svg>
      </span>
      <span class="nav__label">Agregar Usuario</span>
    </button>
  </div>
</nav>

<div class="credentials-container">

  <div *ngIf="cargando" class="loading-spinner">
    Cargando usuarios...
  </div>

  <div *ngIf="errorMensaje" class="alert alert-danger">
    {{ errorMensaje }}
  </div>

  <table *ngIf="!cargando && credenciales.length > 0" class="credentials-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of credenciales">
        <td>#{{ item.id }}</td>
        <td>{{ item.username }}</td>
        <td>{{ item.email }}</td>
        <td><span class="badge-role">{{ item.rol }}</span></td>
        <td>
          <app-status-badge [texto]="item.estado ? 'Activo' : 'Inactivo'"
            [variante]="item.estado ? 'activo' : 'inactivo'">
          </app-status-badge>
        </td>
        <td class="text-right">
          <button type="button" class="btn-toggle-action" [class.active]="item.estado" (click)="toggleEstado(item)">
            {{ item.estado ? 'Desactivar' : 'Activar' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!cargando && totalPaginas > 0" class="pagination-controls">

    <span class="pagination-info">
      Mostrando página <strong>{{ numeroPagina + 1 }}</strong> de <strong>{{ totalPaginas }}</strong>
      ({{ totalElementos }} registros totales)
    </span>

    <div class="pagination-actions">
      <button (click)="paginaAnterior()" [disabled]="numeroPagina === 0" class="btn-pagination" title="Anterior">
        ‹
      </button>

      <button class="btn-pagination active">
        {{ numeroPagina + 1 }}
      </button>

      <button (click)="paginaSiguiente()" [disabled]="esUltimaPagina" class="btn-pagination" title="Siguiente">
        ›
      </button>
    </div>

  </div>
</div>

  <div class="modal-overlay" *ngIf="mostrarFormulario" (click)="cerrarFormulario()">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
      <button class="modal-cerrar" (click)="cerrarFormulario()">✕</button>
      <app-register-credentials></app-register-credentials>
    </div>
