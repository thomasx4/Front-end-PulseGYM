<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="campo">
        <label>Nombre de usuario</label>
        <input type="text" formControlName="username" />

        <div class="errores" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            <small *ngIf="form.get('username')?.hasError('required')">
                El nombre de usuario es obligatorio.
            </small>
            <small *ngIf="form.get('username')?.hasError('minlength')">
                Mínimo 3 caracteres.
            </small>
        </div>
    </div>

    <div class="campo">
        <label>Email</label>
        <input type="email" formControlName="email" />

        <div class="errores" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            <small *ngIf="form.get('email')?.hasError('required')">
                El email es obligatorio.
            </small>
            <small *ngIf="form.get('email')?.hasError('email')">
                Debe ser un correo electrónico válido.
            </small>
        </div>
    </div>

    <div class="campo">
        <label>Contraseña</label>
        <input type="password" formControlName="password" />

        <div class="errores" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            <small *ngIf="form.get('password')?.hasError('required')">
                La contraseña es obligatoria.
            </small>
            <small *ngIf="form.get('password')?.hasError('minlength')">
                La contraseña debe tener mínimo 8 caracteres.
            </small>
        </div>
    </div>

    <div class="campo">
        <label>Rol</label>
        <select formControlName="rol">
            <option value="" disabled selected>Selecciona un rol</option>
            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>

        <div class="errores" *ngIf="form.get('rol')?.invalid && form.get('rol')?.touched">
            <small *ngIf="form.get('rol')?.hasError('required')">
                El rol es obligatorio.
            </small>
        </div>
    </div>

    <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <button type="submit" [disabled]="enviando">
        {{ enviando ? 'Registrando...' : 'Agregar Usuario' }}
    </button>
</form>
