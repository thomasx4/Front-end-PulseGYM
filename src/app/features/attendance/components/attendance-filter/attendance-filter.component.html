<div class="filter-container">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input 
      type="text" 
      class="search-input" 
      placeholder="Buscar por socio, ID..." 
      [value]="textoBusqueda"
      (input)="onSearchInput($event)" 
    />
  </div>

  <div class="filter-menu">
    <button type="button" class="filter-btn" (click)="toggle()">
      <span class="filter-btn__icon">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 3H16V1H0V3Z" fill="currentColor"></path>
          <path d="M2 7H14V5H2V7Z" fill="currentColor"></path>
          <path d="M4 11H12V9H4V11Z" fill="currentColor"></path>
          <path d="M10 15H6V13H10V15Z" fill="currentColor"></path>
        </svg>
      </span>
      <span class="filter-btn__label">Filtrar</span>
    </button>

    <div class="filter-menu__panel" *ngIf="abierto">
      <label>
        Tipo de Acceso
        <select [(ngModel)]="tipoAccesoSeleccionado">
          <option value="">Todos</option>
          <option value="APP">App Móvil</option>
          <option value="BIOMÉTRICO">Biométrico</option>
        </select>
      </label>

      <label>
        Estado
        <select [(ngModel)]="estadoSeleccionado">
          <option value="">Todos</option>
          <option value="PERMITIDO">Permitido</option>
          <option value="DENEGADO">Denegado</option>
        </select>
      </label>

      <label>
        Ordenar por fecha
        <select [(ngModel)]="ordenSeleccionado">
          <option value="desc">Más reciente primero</option>
          <option value="asc">Más antiguo primero</option>
        </select>
      </label>

      <div class="filter-menu__acciones">
        <button class="filter-menu__accion btn-secundario" type="button" (click)="onLimpiar()">Limpiar</button>
        <button class="filter-menu__accion" type="button" (click)="onAplicar()">Aplicar</button>
      </div>
    </div>
  </div>
</div>
