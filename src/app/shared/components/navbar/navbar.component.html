<aside class="sidebar" [class.mobile-open]="isMobileOpen">
    <!-- Botón de cierre para móvil -->
    <button class="sidebar__close" (click)="toggleMobileMenu()" *ngIf="isMobileOpen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div class="sidebar__brand">
        <img src="../../../../../favicon.ico" class="sidebar__brand-icon" alt="Pulse Gym">
        <div>
            <h1 class="sidebar__brand-name">PULSE GYM</h1>
            <span class="sidebar__brand-role">SOCIO</span>
        </div>
    </div>

    <nav class="sidebar__nav">
        <!-- Dashboard -->
        <a routerLink="/user" routerLinkActive="sidebar__nav-item--active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg viewBox="0 -0.5 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M9.918 10.0005H7.082C6.66587 9.99708 6.26541 10.1591 5.96873 10.4509C5.67204 10.7427 5.50343 11.1404 5.5 11.5565V17.4455C5.5077 18.3117 6.21584 19.0078 7.082 19.0005H9.918C10.3341 19.004 10.7346 18.842 11.0313 18.5502C11.328 18.2584 11.4966 17.8607 11.5 17.4445V11.5565C11.4966 11.1404 11.328 10.7427 11.0313 10.4509C10.7346 10.1591 10.3341 9.99708 9.918 10.0005Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

                    <path fill-rule="evenodd" clip-rule="evenodd" d="M15.082 13.0007H17.917C18.3333 13.0044 18.734 12.8425 19.0309 12.5507C19.3278 12.2588 19.4966 11.861 19.5 11.4447V5.55666C19.4966 5.14054 19.328 4.74282 19.0313 4.45101C18.7346 4.1592 18.3341 3.9972 17.918 4.00066H15.082C14.6659 3.9972 14.2654 4.1592 13.9687 4.45101C13.672 4.74282 13.5034 5.14054 13.5 5.55666V11.4447C13.5034 11.8608 13.672 12.2585 13.9687 12.5503C14.2654 12.8421 14.6659 13.0041 15.082 13.0007Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M15.082 19.0006H17.917C18.7661 19.0247 19.4744 18.3567 19.5 17.5076V16.4936C19.4744 15.6449 18.7667 14.9771 17.918 15.0006H15.082C14.2333 14.9771 13.5256 15.6449 13.5 16.4936V17.5066C13.525 18.3557 14.2329 19.0241 15.082 19.0006Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span>Tablero</span>
        </a>

        <!-- Perfil -->
        <a routerLink="/user/profile" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span>Perfil</span>
        </a>

        <!-- Membresías -->
        <a routerLink="/user/membresias" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
                    <path d="M7 15h5" stroke="currentColor" stroke-width="2"/>
                </svg>
            </span>
            <span>Membresías</span>
        </a>

        <!-- Rutinas -->
        <a routerLink="/user/rutinas" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 4v16" stroke="currentColor" stroke-width="2"/>
                    <path d="M18 4v16" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 8h6" stroke="currentColor" stroke-width="2"/>
                    <path d="M15 8h6" stroke="currentColor" stroke-width="2"/>
                    <path d="M3 16h6" stroke="currentColor" stroke-width="2"/>
                    <path d="M15 16h6" stroke="currentColor" stroke-width="2"/>
                    <path d="M9 12h6" stroke="currentColor" stroke-width="2"/>
                </svg>
            </span>
            <span>Rutinas</span>
        </a>

        <!-- Plan Nutricional -->
        <a routerLink="/user/plan-nutricional" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 21s6-3 6-8V5l-6-2.5L6 5v8c0 5 6 8 6 8z"/>
                    <path d="M12 8v5"/>
                </svg>
            </span>
            <span>Plan Nutricional</span>
        </a>

                <!-- Pagos (Actualizado a /user/pagos) -->
        <a routerLink="/user/pagos" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M2 10h20" stroke="currentColor" stroke-width="2"/>
                    <path d="M6 15h4" stroke="currentColor" stroke-width="2"/>
                </svg>
            </span>
            <span>Pagos</span>
        </a>

        <!-- Ajustes -->
        <a routerLink="/user/ajustes" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item">
            <span class="sidebar__icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </span>
            <span>Ajustes</span>
        </a>
    </nav>

    <!-- Cerrar Sesión -->
    <button class="sidebar__logout" (click)="logout()">
        <span class="sidebar__icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </span>
        <span>Cerrar Sesión</span>
    </button>
</aside>

<!-- Botón Hamburguesa (solo móvil) -->
<button class="hamburger-btn" (click)="toggleMobileMenu()" [class.active]="isMobileOpen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>
