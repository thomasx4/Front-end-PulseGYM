<div class="fp-scanner">
    <button type="button" class="fp-icon-btn" [class.is-idle]="estado === 'idle'"
        [class.is-scanning]="estado === 'escaneando'" [class.is-success]="estado === 'exito'"
        [class.is-error]="estado === 'error'" [disabled]="estado === 'escaneando'" (click)="onClick()"
        [attr.aria-label]="mensaje || 'Escanear huella digital'">

        <span class="fp-ring"></span>
        <span class="fp-scan-line" *ngIf="estado === 'escaneando'"></span>

        <svg *ngIf="estado === 'idle' || estado === 'escaneando'" class="fp-icon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 11c0 3.5-1 6-1.5 8" />
            <path d="M8.5 20c.6-1.2 1.5-3.5 1.5-6.5a2 2 0 0 1 4 0c0 .8-.05 1.5-.13 2.2" />
            <path d="M5 19c1-2.5 1.5-5 1.5-7A5.5 5.5 0 0 1 17.9 9.5" />
            <path d="M3.5 14.5A11 11 0 0 1 4 10" />
            <path d="M19.4 15.5a10.9 10.9 0 0 0 .1-4" />
            <path d="M12 3.5a8.5 8.5 0 0 1 7.5 4.5" />
            <path d="M8.5 4.2A8.5 8.5 0 0 0 4 12" />
            <path d="M14 14.5a2 2 0 0 0-4 0c0 3-1 5.5-2.3 7.5" />
        </svg>

        <svg *ngIf="estado === 'exito'" class="fp-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </svg>

        <svg *ngIf="estado === 'error'" class="fp-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
    </button>

    <p class="fp-mensaje" *ngIf="mensaje">{{ mensaje }}</p>
</div>
