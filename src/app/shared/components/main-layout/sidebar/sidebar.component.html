<aside class="sidebar" [class.sidebar--open]="isOpen">
    <div class="sidebar__brand">
        <img src="/assets/favicon.ico" class="sidebar__brand-icon" alt="Pulse Gym Logo">
        <div>
            <h1 class="sidebar__brand-name">PULSE GYM</h1>
            <span class="sidebar__brand-role">ADMINISTRADOR</span>
        </div>
    </div>

    <nav class="sidebar__nav">
        <!-- ITEMS NORMALES (SIN SUBMENÚ) -->
        <ng-container *ngFor="let item of menuItems">
            <a *ngIf="!item.children" [routerLink]="item.route" routerLinkActive="sidebar__nav-item--active"
                [routerLinkActiveOptions]="{ exact: item.exact || false }" class="sidebar__nav-item" (click)="closeMenu.emit()">
                <span [innerHTML]="item.iconHtml" class="sidebar__icon-wrapper"></span>
                <span>{{ item.label }}</span>
            </a>
        </ng-container>

        <!-- MI PERFIL -->
        <a routerLink="/dashboard-admin/profile" routerLinkActive="sidebar__nav-item--active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar__nav-item" (click)="closeMenu.emit()">
            <span [innerHTML]="getMiPerfilIcon()" class="sidebar__icon-wrapper"></span>
            <span>Mi Perfil</span>
        </a>

        <!-- ITEM CON SUBMENÚ (MEMBRESÍAS) -->
        <div class="sidebar__nav-item--parent" [class.open]="isMembershipOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isMembershipActive()"
                (click)="toggleMembership()">
                <span [innerHTML]="getMembershipIcon()" class="sidebar__icon-wrapper"></span>
                <span>Membresías</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="sidebar__submenu" [class.open]="isMembershipOpen">
                <div>
                    <!-- Botón opcional para ir a la vista principal si se desea, o listar hijos -->
                    <a class="sidebar__submenu-item" (click)="goToMembershipList()">
                        <span [innerHTML]="getMembershipIcon()" class="sidebar__icon-wrapper"></span>
                        <span>Gestión / Listado</span>
                    </a>
                    <a *ngFor="let child of membershipChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active"
                        [routerLinkActiveOptions]="{ exact: child.exact || false }" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- USUARIOS -->
        <div class="sidebar__nav-item--parent" [class.open]="isUsersOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isUsersActive()" (click)="toggleUsers()">
                <span [innerHTML]="getUsersIcon()" class="sidebar__icon-wrapper"></span>
                <span>Usuarios</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="sidebar__submenu" [class.open]="isUsersOpen">
                <div>
                    <a *ngFor="let child of usersChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active"
                        [routerLinkActiveOptions]="{ exact: child.exact || false }" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- ASISTENCIA -->
        <div class="sidebar__nav-item--parent" [class.open]="isAttendanceOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isAttendanceActive()"
                (click)="toggleAttendance()">
                <span [innerHTML]="getAttendanceIcon()" class="sidebar__icon-wrapper"></span>
                <span>Asistencia</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div class="sidebar__submenu" [class.open]="isAttendanceOpen">
                <div>
                    <a *ngFor="let child of attendanceChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- EQUIPOS -->
        <div class="sidebar__nav-item--parent" [class.open]="isEquipmentOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isEquipmentActive()"
                (click)="toggleEquipment()">
                <span [innerHTML]="getEquipmentIcon()" class="sidebar__icon-wrapper"></span>
                <span>Equipos</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div class="sidebar__submenu" [class.open]="isEquipmentOpen">
                <div>
                    <a *ngFor="let child of equipmentChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- PAGOS -->
        <div class="sidebar__nav-item--parent" [class.open]="isPaymentsOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isPaymentsActive()"
                (click)="togglePayments()">
                <span [innerHTML]="menuItems[1]?.iconHtml || getMembershipIcon()" class="sidebar__icon-wrapper"></span>
                <span>Pagos</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div class="sidebar__submenu" [class.open]="isPaymentsOpen">
                <div>
                    <a *ngFor="let child of paymentsChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- NOTIFICACIONES -->
        <div class="sidebar__nav-item--parent" [class.open]="isNotificationsOpen">
            <div class="sidebar__nav-item" [class.sidebar__nav-item--active]="isNotificationsActive()"
                (click)="toggleNotifications()">
                <span [innerHTML]="notificationsChildren[0]?.iconHtml || getMembershipIcon()"
                    class="sidebar__icon-wrapper"></span>
                <span>Notificaciones</span>
                <svg class="sidebar__dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div class="sidebar__submenu" [class.open]="isNotificationsOpen">
                <div>
                    <a *ngFor="let child of notificationsChildren" [routerLink]="child.route"
                        routerLinkActive="sidebar__submenu-item--active" class="sidebar__submenu-item" (click)="closeMenu.emit()">
                        <span [innerHTML]="child.iconHtml" class="sidebar__icon-wrapper"></span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- MANCUERIA -->
        <a routerLink="/dashboard-admin/mancuer-ia" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item" (click)="closeMenu.emit()">
            <span [innerHTML]="getMancuerIaIcon()" class="sidebar__icon-wrapper"></span>
            <span>MancuerIA</span>
        </a>

        <!-- AJUSTES -->
        <a routerLink="/dashboard-admin/ajustes" routerLinkActive="sidebar__nav-item--active" class="sidebar__nav-item" (click)="closeMenu.emit()">
            <span [innerHTML]="getAjustesIcon()" class="sidebar__icon-wrapper"></span>
            <span>Ajustes</span>
        </a>
    </nav>

    <button class="sidebar__logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar Sesión</span>
    </button>
</aside>
