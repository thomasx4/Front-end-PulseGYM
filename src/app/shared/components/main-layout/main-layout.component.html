<div class="layout">
    <!-- Overlay oscuro para dispositivos móviles cuando el sidebar esté abierto -->
    <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>

    <app-sidebar [isOpen]="isSidebarOpen" (closeMenu)="closeSidebar()"></app-sidebar>

    <div class="layout__content">
        <app-header (toggleMenu)="toggleSidebar()"></app-header>
        <main class="layout__page">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
